<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Required - Mothership</title>
    <link rel="icon" type="image/png" href="/static/icon.png">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        
        .warning {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2rem;
            border-radius: 10px;
            margin: 2rem 0;
        }
        
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin: 0.5rem;
        }
        
        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .btn-primary {
            background: rgba(72, 187, 120, 0.8);
            border-color: #48bb78;
        }
        
        .btn-primary:hover {
            background: rgba(72, 187, 120, 1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Authentication Required</h1>
        <div class="warning">
            <h3>This server requires authentication</h3>
            <p>To download CLI tools, you must first sign in with your authorized account.</p>
        </div>
        <a href="/login" class="btn btn-primary">Sign In</a>
        <a href="/" class="btn">&larr; Back to Home</a>
    </div>
</body>
</html>
