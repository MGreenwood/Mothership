services:
  mothership:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "${MOTHERSHIP_PORT:-7523}:7523"  # API port
      - "${WEB_PORT:-8085}:8085"         # Web UI port
    environment:
      # Server settings
      - MOTHERSHIP_PORT=${MOTHERSHIP_PORT}
      - RUST_LOG=${RUST_LOG}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Database settings
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/mothership
      # OAuth configuration
      - OAUTH_BASE_URL=https://api.mothership.rest
      - WEB_UI_BASE_URL=https://app.mothership.rest
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      # GhostID provider login configuration
      - GHOSTID_DOMAIN=${GHOSTID_DOMAIN:-mothership.rest}
      - GHOSTID_VERIFIER_URL=${GHOSTID_VERIFIER_URL:-https://api.ghostid.rest}
      - PROVIDER_PRIVATE_KEY_FILE=/run/secrets/ghostid-provider.pem
      - SESSION_DB_PATH=/app/data/ghostid.db
    volumes:
      - ./storage:/app/storage
      - ./cli-binaries:/app/cli-binaries
      - ./data:/app/data
      - ${PROVIDER_PRIVATE_KEY_FILE:-C:/Users/craft/.ghostid-launchpad/keys/provider-f6f6bf1cd8024e2ca3bcdb811c4ed9b6.pem}:/run/secrets/ghostid-provider.pem:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7523/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - mothership-net

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./mothership-tunnel.yml:/etc/cloudflared/config.yml:ro
      - ~/.cloudflared:/etc/cloudflared/credentials:ro
    depends_on:
      - mothership
    restart: unless-stopped
    networks:
      - mothership-net

  db:
    image: postgres:13-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MAX_CONNECTIONS=100
      - POSTGRES_MAX_CONNECTIONS=100
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mothership-net

volumes:
  postgres_data:

networks:
  mothership-net:
    driver: bridge 