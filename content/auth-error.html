<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{HEADING}} - Mothership</title>
    <link rel="icon" type="image/png" href="/static/icon.png">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at top, #1f2d3a 0%, #111820 70%);
            color: #e6edf3;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 150, 150, 0.3);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
            padding: 40px 36px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .logo { width: 120px; height: auto; margin-bottom: 8px; }
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #e5707a;
            color: #111820;
            font-size: 30px;
            font-weight: bold;
            margin: 12px auto 16px;
        }
        h1 { font-size: 1.6rem; margin: 0 0 12px; }
        .detail { color: #c3ccd5; line-height: 1.6; margin: 0 0 20px; }
        .reason {
            background: rgba(229, 112, 122, 0.08);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.9rem;
            color: #f2b8bd;
            word-break: break-word;
            margin-bottom: 24px;
        }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 24px;
            font-weight: bold;
        }
        .btn-primary { background: #7fc07f; color: #111820; }
        .btn-primary:hover { background: #95d495; }
        .btn-secondary { border: 1px solid #8b98a5; color: #e6edf3; }
        .btn-secondary:hover { border-color: #e6edf3; }
    </style>
</head>
<body>
    <main class="card">
        <img class="logo" src="/static/logo.png" alt="Mothership logo">
        <div class="badge" aria-hidden="true">!</div>
        <h1>{{HEADING}}</h1>
        <p class="detail">{{DETAIL}}</p>
        <div class="reason">Reason: {{MESSAGE}}</div>
        <div class="actions">
            <a class="btn btn-primary" href="/login">Try signing in again</a>
            <a class="btn btn-secondary" href="/">Home</a>
        </div>
    </main>
</body>
</html>
