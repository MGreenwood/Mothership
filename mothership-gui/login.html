<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mothership Login</title>
  <style>
    body { display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#1a1a1a; color:#fff; font-family:sans-serif; }
    #qr-container { text-align:center; }
    #qr-image { max-width:300px; }
    #message { margin-top:16px; color:#ccc; }
  </style>
</head>
<body>
  <div id="qr-container">
    <h1>Scan to Login</h1>
    <img id="qr-image" alt="Loading QR..." />
    <div id="message">Generating...</div>
  </div>

  <script type="module">
    import { startChallenge, generateQrCode } from '/qr-auth-widget/src/index.js';
    (async () => {
      try {
        const apiBase = window.MOTHERSHIP_API_BASE_URL || window.location.origin;
        const chId = await startChallenge(apiBase, window.location.hostname);
  const deepLink = `ghostidwallet://auth?challenge=${chId}`;
        const dataUrl = await generateQrCode(deepLink, { width: 300 });
        document.getElementById('qr-image').src = dataUrl;
  document.getElementById('message').textContent = 'Scan with GhostID Wallet';
      } catch (e) {
        document.getElementById('message').textContent = 'Error: ' + e.message;
      }
    })();
  </script>
</body>
</html>
