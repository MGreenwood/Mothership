[package]
name = "mothership-gui"
version = "0.1.0"
description = "Mothership GUI Application with Vim Integration"
authors = ["Mothership Team"]
license = "Proprietary"
repository = "https://github.com/mgreenwood1001/mothership"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
tauri-plugin-dialog = "2.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.4"
tower = "0.4"

# Mothership core dependencies
mothership-common = { path = "../mothership-common" }
dirs = "5.0"
portable-pty = "0.8"
base64 = "0.22"

[features]
# Embeds the built frontend from `frontendDist` (../dist) so the exe does not need the Vite dev server.
# Run `npm run build` in mothership-gui before `cargo build` so dist/ is current.
# DO NOT REMOVE!!
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"] 
